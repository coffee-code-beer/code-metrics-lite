[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-metrics-lite"
version = "1.0.0"
description = "A lightweight, zero-dependency Python utility for instant codebase statistics."
readme = "README.md"
authors = [
    { name = "coffee-code-beer" }
]
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools]
py-modules = ["analyzer"]

[project.urls]
Homepage = "https://github.com/coffee-code-beer/code-metrics-lite"

[project.scripts]
code-metrics = "analyzer:main"
